async function api(method,url,body){
  const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let r;try{r=await fetch(url,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)})}catch(e){throw new Error('No se pudo conectar con el servidor. Revisá tu conexión.')}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&d.error)||'Error del servidor ('+r.status+')');e.status=r.status;if(r.status===401&&TOKEN&&url!=='/api/login')onExpired();throw e}
  return d;
}

  else if(t==='pedidos'||t==='ventas'||t==='facturacion')db.orders=await api('GET','/api/admin/pedidos');

}

function addDetail(id){
  const p=db.products.find(x=>x.id===id),g=x=>document.getElementById(x);
  const err=m=>{g('derr').innerHTML=`<div class="msg" role="alert">${m}</div>`};
  const size=g('dsz')?g('dsz').value:'',color=g('dcl')?g('dcl').value:'';
  if(g('dsz')&&!size)return err('Elegí una versión.');
  if(g('dcl')&&!color)return err('Elegí un color.');
  const pers='';
  if(!addKey(id,size,color,pers))return err('Ya tenés todo el stock disponible en el carrito.');
  S.sel[id]={size,color};dlg.close();

/* ---------- CARRITO ---------- */
function cartItems(){return Object.entries(S.cart).map(([k,q])=>{const [id,size,color,pers]=k.split('|');const p=db.products.find(x=>x.id==id);return p&&p.activo!==false?{p,q,size,color,pers,k}:null}).filter(Boolean)}
function inCart(id){return cartItems().filter(i=>i.p.id===id).reduce((a,i)=>a+i.q,0)}
function vlabel(size,color,pers){return [size,color,pl(pers)].filter(Boolean).join(' · ')}
function cartSub(){return cartItems().reduce((a,i)=>a+unitOf(i.p,i.pers)*i.q,0)}
function totals(){const sub=cartSub(),dsc=0,retiro=S.co.envio==='retiro',envio=retiro?0:(sub>=FREE?0:SHIP);return{sub,dsc,envio,retiro,total:sub-dsc+envio}}
function vCarrito(){
  const it=cartItems();
  if(!it.length)return `<div class="panel empty">Tu carrito está vacío.<br><br><button class="btn" onclick="clearF()">Ver productos</button></div>`;
  const sub=cartSub(),left=Math.max(0,FREE-sub);
  return `<h2 style="margin-bottom:12px">Tu carrito</h2><div class="panel">
  <div class="ship"><div>${left?`Te faltan ${$m(left)} para tener envío gratis`:'¡Tenés envío gratis!'}</div><div class="meter"><span style="width:${Math.min(100,sub/FREE*100)}%"></span></div></div>
  ${it.map(({p,q,size,color,pers},i)=>`<div class="cartrow"><div class="thumb">${thumb(p)}</div>
  <div class="n"><strong>${esc(p.name)}</strong><div class="mut">${$m(unitOf(p,pers))} c/u${size||color||pers?' · '+esc(vlabel(size,color,pers)):''}</div></div>
  <div class="qty"><button aria-label="Quitar uno" onclick="qty(${i},-1)">−</button><span>${q}</span><button aria-label="Sumar uno" onclick="qty(${i},1)">+</button></div>
  <strong>${$m(unitOf(p,pers)*q)}</strong><button class="btn del" onclick="qty(${i},-999)">Quitar</button></div>`).join('')}
  <div class="tot big"><span>Subtotal</span><span>${$m(sub)}</span></div>
  <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn sec" onclick="clearF()">Seguir comprando</button><button class="btn" onclick="go('checkout')">Confirmar pedido</button></div></div>`;
}
function qty(i,d){const it=cartItems()[i];if(!it)return;let n=it.q+d;if(d>0&&inCart(it.p.id)>=it.p.stock)n=it.q;if(n<=0)delete S.cart[it.k];else S.cart[it.k]=n;render()}

  <h3 style="margin:16px 0 6px">Resumen</h3>${it.map(({p,q,size,color,pers})=>`<div class="tot"><span>${q} × ${esc(p.name)}${size||color||pers?' ('+esc(vlabel(size,color,pers))+')':''}</span><span>${$m(unitOf(p,pers)*q)}</span></div>`).join('')}
  <div class="tot"><span>Subtotal</span><span>${$m(T.sub)}</span></div>

async function confirmOrder(){
  keepForm();const F=S.form,T=totals(),dom=!T.retiro;
  const n=F.n.trim(),e=F.e.trim(),a=F.a.trim();
  if(!n||!/^\S+@\S+\.\S+$/.test(e)||(dom&&!a)){S.err=dom?'Completá nombre, un email válido y la dirección de entrega.':'Completá tu nombre y un email válido.';renderMain();return}
  const items=cartItems().map(({p,q,size,color})=>({idProducto:p.id,version:size||null,color:color||null,cantidad:q}));
  try{
    const r=await api('POST','/api/pedidos',{nombre:n,email:e,retiro:!dom,direccion:dom?a:null,items});
    S.last=r.order;S.cart={};S.err='';S.form=S.cust?{n:S.cust.name,e:S.cust.email,a:''}:{n:'',e:'',a:''};
    await loadPublic();go('gracias');
  }catch(err){S.err=err.message;renderMain()}
}
function vGracias(){

  <button class="btn" onclick="login()">Iniciar sesión</button>

async function login(){
  try{const r=await api('POST','/api/login',{usuario:lu.value.trim(),clave:lp.value});setToken(r.token);S.err='';await enter(r);go(r.tipo==='empleado'?'admin':'cuenta')}
  catch(e){S.err=e.message;renderMain()}
}
async function signup(){
  const n=sn.value.trim(),e=se.value.trim().toLowerCase(),p=sp.value,p2=sp2.value;S.su={n,e};
  const err=m=>{S.err=m;renderMain()};
  if(!n)return err('Ingresá tu nombre.');
  if(!/^\S+@\S+\.\S+$/.test(e))return err('Ingresá un email válido.');
  if(p.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
  if(p!==p2)return err('Las contraseñas no coinciden.');
  try{const r=await api('POST','/api/cuentas',{nombre:n,email:e,clave:p});setToken(r.token);S.su={n:'',e:''};S.err='';await enter(r);go('cuenta')}
  catch(x){err(x.message)}
}
function logout(){setToken(null);S.user=null;S.cust=null;S.mis=[];S.form={n:'',e:'',a:''};loadPublic().then(()=>render()).catch(()=>{});go('tienda')}
function vCuenta(){
  if(!S.cust)return vLogin();
  const L=S.mis;
  return `<h2 style="margin-bottom:4px">Hola, ${esc(S.cust.name)}</h2><p class="mut" style="margin:0 0 14px">${esc(S.cust.email)}</p>
  <div class="panel"><h3 style="margin-bottom:10px">Mis pedidos</h3>${L.length?L.map(o=>`<div class="cartrow" style="display:block"><div class="tot"><strong>Pedido N° ${o.id} · ${fdate(o.date)} ${stBadge(o)}</strong><strong>${$m(o.total)}</strong></div><div class="mut">${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.size||i.color||i.pers?' ('+esc(vlabel(i.size,i.color,i.pers))+')':''}`).join(', ')}</div></div>`).join(''):'<div class="empty">Todavía no hiciste pedidos con este email.</div>'}</div>

/* productos */
function aSearchP(v){S.aq=v;renderMain();const i=document.getElementById('aqi');if(i&&i.focus){i.focus();if(i.setSelectionRange)i.setSelectionRange(v.length,v.length)}}
function aProd(){
  const cg=can('ganancias'),pr=can('precios'),q=(S.aq||'').toLowerCase();
  const L=db.products.filter(p=>(!S.low||p.stock<=5)&&(!q||(p.name+' '+p.cat+' '+(p.brand||'')).toLowerCase().includes(q)));

  <div class="row" style="align-items:center"><div class="f"><label for="aqi">Buscar producto</label><input id="aqi" value="${esc(S.aq||'')}" oninput="aSearchP(this.value)"></div><label class="opt" style="margin:0"><input type="checkbox" ${S.low?'checked':''} onchange="S.low=this.checked;renderMain()"><span>Solo stock bajo (5 o menos)</span></label></div>
  ${L.length?`<div class="tw"><table class="${pr?'':'narrow'}"><thead><tr><th>Producto</th>${pr?'<th class="r">Neto</th><th class="r">Público</th><th class="r">Desc.</th>':''}${cg?'<th class="r">Costo</th><th class="r">Margen</th>':''}<th class="r">Stock</th></tr></thead><tbody>

    <div class="acts2" style="justify-content:flex-start;margin-top:6px">
    ${can('stock')?`<button class="btn" onclick="stockForm(${p.id})">+ Stock</button>`:''}
    ${can('precios')?`<button class="btn sec" onclick="priceForm(${p.id})">Precio</button>`:''}
    ${can('altabaja')?`<button class="btn sec" onclick="prodForm(${p.id})">Editar</button><button class="btn ${off?'':'del'}" onclick="toggleProd(${p.id})">${off?'Dar de alta':'Dar de baja'}</button>`:''}
    </div></td>
    ${pr?`<td class="r">${$m(p.net)}</td><td class="r">${$m(pub(p))}</td><td class="r">${p.disc||0}%</td>`:''}${cg?`<td class="r">${$m(p.cost||0)}</td><td class="r">${mg.toFixed(0)}%</td>`:''}

function pricePrev(){

async function savePrice(id){
  if(!can('precios'))return;
  const n=parseFloat(xn.value),i=parseFloat(xi.value),d=parseFloat(xd.value)||0;

  const body={neto:n,iva:i,descuento:d};
  if(can('ganancias')&&document.getElementById('xc'))body.costo=Math.max(0,parseFloat(xc.value)||0);

  catch(e){perr.innerHTML=`<div class="msg">${esc(e.message)}</div>`}

    await api('PATCH','/api/admin/productos/'+id+'/activo',{activo:!baja});
    if(baja)Object.keys(S.cart).forEach(k=>{if(k.split('|')[0]==id)delete S.cart[k]});
    await loadTab('productos');
  }catch(e){alert(e.message)}
  render();
}

  <div class="f" style="margin-bottom:8px"><label>Imagen (opcional, máx. 300 KB)</label><input id="pi" type="file" accept="image/*"></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Versiones (capacidad, pulgadas…; separadas por coma)</label><input id="pt" value="${esc((p.sizes||[]).join(', '))}"></div><div class="f"><label>Colores (separados por coma)</label><input id="pk" value="${esc((p.colors||[]).join(', '))}"></div></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Tipo de producto</label><select id="ptype">${opts(KINDS,p.kind||'')}</select></div><div class="f"><label>Marca</label><input id="pbrand" list="brands" value="${esc(p.brand||'')}"><datalist id="brands">${BRANDS.map(b=>`<option value="${b}">`).join('')}</datalist></div></div>
  <div class="f" style="margin-bottom:8px"><label>Año de lanzamiento</label><input id="pyear" placeholder="2026" value="${esc(p.year||'')}"></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Precio neto</label><input id="pp" type="number" min="0" step="0.01" value="${p.net}"></div><div class="f"><label>IVA %</label><input id="pv" type="number" min="0" max="100" step="0.5" value="${p.iva}"></div></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Descuento %</label><input id="pdc" type="number" min="0" max="100" value="${p.disc||0}"></div><div class="f"><label>Stock</label><input id="ps" type="number" min="0" value="${p.stock}"></div></div>
  ${cg?`<div class="f" style="margin-bottom:8px"><label>Costo (sin IVA)</label><input id="pcost" type="number" min="0" step="0.01" value="${p.cost||0}"></div>`:''}
  <div id="perr"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn" onclick="saveProd(${id||0})">Guardar cambios</button></div>`;
  dlg.showModal();
}
const lst=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
async function saveProd(id){
  if(!can('altabaja'))return;
  const name=pn.value.trim(),net=parseFloat(pp.value);
  if(!name||isNaN(net)||net<0){perr.innerHTML='<div class="msg">Ingresá nombre y un precio neto válido.</div>';return}
  const send=async img=>{
    const body={nombre:name,desc:pd.value.trim(),cat:pc.value.trim()||'General',emoji:pe.value.trim()||'📦',neto:net,iva:parseFloat(pv.value)||0,disc:parseFloat(pdc.value)||0,stock:Math.max(0,parseInt(ps.value)||0),sizes:lst(pt.value),colors:lst(pk.value),kind:ptype.value,brand:pbrand.value.trim(),year:pyear.value.trim()};
    if(can('ganancias')&&document.getElementById('pcost'))body.costo=Math.max(0,parseFloat(pcost.value)||0);
    if(img)body.imagen=img;
    try{await api(id?'PUT':'POST','/api/admin/productos'+(id?'/'+id:''),body);await loadTab('productos');dlg.close();render()}
    catch(e){perr.innerHTML=`<div class="msg">${esc(e.message)}</div>`}
  };
  const f=pi.files&&pi.files[0];
  if(f){if(f.size>300000){perr.innerHTML='<div class="msg">La imagen supera los 300 KB.</div>';return}const r=new FileReader();r.onload=()=>send(r.result);r.readAsDataURL(f)}else send(null);
}
/* empleados */
function aEmp(){
  return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h3>Empleados y roles</h3><button class="btn" onclick="empForm()">Nuevo empleado</button></div>
  <div class="tw"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th></th></tr></thead><tbody>
  ${db.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.user)}</td><td>${esc(ROLES[e.role])}</td><td class="r"><button class="btn sec" onclick="empForm(${e.id})">Editar</button> <button class="btn del" onclick="delEmp(${e.id})">Borrar</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function empForm(id){
  const e=db.employees.find(x=>x.id===id)||{name:'',user:'',pass:'',role:'cajero'};
  if(e.role==='dueno'&&S.user.role!=='dueno'){alert('Solo el dueño puede modificar al dueño.');return}
  dlg.innerHTML=`<h3 style="margin-bottom:12px">${id?'Editar':'Nuevo'} empleado</h3><div class="f" style="margin-bottom:8px"><label>Nombre completo</label><input id="en" value="${esc(e.name)}"></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Usuario</label><input id="eu" value="${esc(e.user)}"></div><div class="f"><label>Contraseña</label><input id="ep" type="password" autocomplete="new-password" placeholder="${id?'Dejar vacía para no cambiarla':''}"></div></div>
  <div class="f" style="margin-bottom:8px"><label>Rol</label><select id="er">${Object.entries(ROLES).filter(([k])=>S.user.role==='dueno'||k!=='dueno').map(([k,v])=>`<option value="${k}" ${e.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div id="perr"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn" onclick="saveEmp(${id||0})">Guardar cambios</button></div>`;
  dlg.showModal();
}
async function saveEmp(id){
  const o={usuario:eu.value.trim(),nombre:en.value.trim(),rol:er.value,clave:ep.value};
  if(!o.nombre||!o.usuario||(!id&&o.clave.length<4)||(o.clave&&o.clave.length<4)){perr.innerHTML='<div class="msg">Completá nombre, usuario y una contraseña de al menos 4 caracteres.</div>';return}
  try{await api(id?'PUT':'POST','/api/admin/empleados'+(id?'/'+id:''),o);await loadTab('empleados');dlg.close();render()}
  catch(e){perr.innerHTML=`<div class="msg">${esc(e.message)}</div>`}
}
async function delEmp(id){
  if(!confirm('¿Borrar este empleado?'))return;
  try{await api('DELETE','/api/admin/empleados/'+id);await loadTab('empleados')}catch(e){alert(e.message)}
  render();
}
/* ventas */
function filtered(){
  return db.orders.filter(o=>{const d=o.date.slice(0,10);return(!S.from||d>=S.from)&&(!S.to||d<=S.to)&&(!S.prod||o.items.some(i=>i.id==S.prod))}).slice().reverse();
}
function aVentas(){
  const L=filtered();
  const tot=L.filter(o=>o.estado!=='cancelado').reduce((a,o)=>a+o.total,0);
  return `<div class="panel"><h3 style="margin-bottom:10px">Listado general de ventas</h3><div class="row">
  <div class="f"><label>Desde</label><input type="date" value="${S.from}" onchange="S.from=this.value;render()"></div>
  <div class="f"><label>Hasta</label><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div>
  <div class="f"><label>Producto</label><select onchange="S.prod=this.value;render()"><option value="">Todos</option>${db.products.map(p=>`<option value="${p.id}" ${S.prod==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <button class="btn sec" onclick="S.from=S.to=S.prod='';render()">Limpiar filtros</button></div>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Estado</th><th class="r">Total</th></tr></thead><tbody>
  ${L.map(o=>`<tr><td>${o.id}</td><td>${fdate(o.date)}</td><td>${esc(o.cliente)}</td><td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.size||i.color||i.pers?' ('+esc(vlabel(i.size,i.color,i.pers))+')':''}`).join(', ')}</td><td>${stBadge(o)}</td><td class="r">${$m(o.total)}</td></tr>`).join('')}</tbody></table></div>
  <div class="tot big"><span>${L.filter(o=>o.estado!=='cancelado').length} ventas (sin contar canceladas)</span><span>${$m(tot)}</span></div>`:`<div class="empty">No hay ventas para esos filtros.</div>`}</div>`;
}
/* facturacion */
function weekStart(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function keyOf(iso){
  const d=new Date(iso);
  if(S.per==='dia')return [dstr(d),fdate(d)];
  if(S.per==='semana'){const w=weekStart(d);return [dstr(w),'Semana del '+fdate(w)]}
  if(S.per==='mes')return [`${d.getFullYear()}-${pad(d.getMonth()+1)}`,['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]+' '+d.getFullYear()];
  return [String(d.getFullYear()),String(d.getFullYear())];
}
function aFact(){
  const g={};
  db.orders.filter(o=>o.estado!=='cancelado').forEach(o=>{const [k,l]=keyOf(o.date);const r=g[k]||(g[k]={l,n:0,net:0,iva:0,total:0});r.n++;r.net+=o.net;r.iva+=o.iva;r.total+=o.total});
  const rows=Object.keys(g).sort().reverse().map(k=>g[k]);
  const max=Math.max(1,...rows.map(r=>r.total));
  const T=rows.reduce((a,r)=>({net:a.net+r.net,iva:a.iva+r.iva,total:a.total+r.total}),{net:0,iva:0,total:0});
  return `<div class="panel"><h3 style="margin-bottom:10px">Facturación</h3><div class="tabs" role="tablist">${[['dia','Diaria'],['semana','Semanal'],['mes','Mensual'],['anio','Anual']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.per===k}" onclick="S.per='${k}';render()">${l}</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Período</th><th class="r">Pedidos</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th><th style="width:25%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.l)}</td><td class="r">${r.n}</td><td class="r">${$m(r.net)}</td><td class="r">${$m(r.iva)}</td><td class="r"><strong>${$m(r.total)}</strong></td><td><div class="bar" style="width:${Math.round(r.total/max*100)}%"></div></td></tr>`).join('')}</tbody></table></div>
  <div class="tot big"><span>Total facturado</span><span>${$m(T.total)}</span></div><div class="mut">Neto ${$m(T.net)} · IVA ${$m(T.iva)}</div>`:`<div class="empty">Todavía no hay ventas registradas.</div>`}</div>`;
}
/* pedidos: estados */
const stBadge=o=>`<span class="st st-${o.estado||'pendiente'}">${o.estado||'pendiente'}</span>`;
function pSearch(v){S.pq=v;renderMain();const i=document.getElementById('pqi');if(i&&i.focus){i.focus();if(i.setSelectionRange)i.setSelectionRange(v.length,v.length)}}
function aPed(){
  if(!can('pedidos'))return '<div class="panel empty">No tenés permiso para ver los pedidos.</div>';
  const q=S.pq.toLowerCase(),cnt=e=>db.orders.filter(o=>o.estado===e).length;
  const L=db.orders.slice().reverse().filter(o=>(!S.pf||o.estado===S.pf)&&(!q||String(o.id).includes(q)||(o.cliente+' '+(o.email||'')).toLowerCase().includes(q)));
  return `<div class="panel"><h3 style="margin-bottom:10px">Pedidos y estados</h3>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${!S.pf}" onclick="S.pf='';renderMain()">Todos (${db.orders.length})</button>${ESTADOS.map(e=>`<button class="tab" role="tab" aria-selected="${S.pf===e}" onclick="S.pf='${e}';renderMain()">${e[0].toUpperCase()+e.slice(1)} (${cnt(e)})</button>`).join('')}</div>
  <div class="row"><div class="f"><label for="pqi">Buscar por número, nombre o email</label><input id="pqi" value="${esc(S.pq)}" oninput="pSearch(this.value)"></div></div>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Entrega</th><th>Productos</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>
  ${L.map(o=>`<tr><td>${o.id}</td><td>${fdate(o.date)}</td><td>${esc(o.cliente)}<div class="mut">${esc(o.email||'')}</div></td><td>${o.retiro?'Retiro en sucursal':esc(o.addr||'—')}</td>
  <td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.size||i.color||i.pers?' ('+esc(vlabel(i.size,i.color,i.pers))+')':''}`).join(', ')}</td><td class="r">${$m(o.total)}</td>
  <td>${o.estado==='cancelado'?stBadge(o):`<select aria-label="Estado del pedido ${o.id}" onchange="setEstado(${o.id},this.value)">${ESTADOS.map(e=>`<option ${o.estado===e?'selected':''}>${e}</option>`).join('')}</select>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay pedidos con ese filtro.</div>'}
  <p class="mut">Al cancelar un pedido se devuelve el stock y deja de contarse en la facturación y en las ganancias. Un pedido cancelado no se puede reactivar.</p></div>`;
}
async function setEstado(id,e){
  if(!can('pedidos'))return;
  const o=db.orders.find(x=>x.id===id);if(!o||o.estado==='cancelado'||o.estado===e||!ESTADOS.includes(e)){render();return}
  if(e==='cancelado'&&!confirm('¿Cancelar el pedido '+id+'? Se devuelve el stock y no se puede reactivar.')){render();return}
  try{await api('PATCH','/api/admin/pedidos/'+id+'/estado',{estado:e});await loadTab(S.tab==='arrepentimientos'?'arrepentimientos':'pedidos')}catch(err){alert(err.message)}
  render();
}
/* arrepentimientos */
function aArrep(){
  if(!can('arrepentimientos'))return '<div class="panel empty">No tenés permiso para ver esta sección.</div>';
  const L=db.cancels.slice().reverse();
  return `<div class="panel"><h3 style="margin-bottom:10px">Solicitudes de arrepentimiento</h3>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Compra</th><th class="r">Monto a reembolsar</th><th>Estado</th></tr></thead><tbody>
  ${L.map(c=>{const o=db.orders.find(x=>String(x.id)===String(c.pedido).trim());return `<tr><td>${c.id}</td><td>${fdate(c.date)}</td><td>${esc(c.nombre||'—')}<div class="mut">${esc(c.email)}</div></td>
  <td>N° ${esc(c.pedido)}<div class="mut">${o?`Pedido encontrado · ${esc(o.cliente)} · ${$m(o.total)} · ${stBadge(o)}`:'No coincide con ningún pedido'}</div>${o&&o.estado!=='cancelado'&&can('pedidos')?`<button class="btn del" style="margin-top:6px;padding:4px 10px;font-size:.85rem" onclick="setEstado(${o.id},'cancelado')">Cancelar ese pedido</button>`:''}</td>
  <td class="r">${c.monto?$m(c.monto):'—'}</td><td><select aria-label="Estado de la solicitud ${c.id}" onchange="setArrep(${c.id},this.value)">${ARREP_ESTADOS.map(e=>`<option ${c.estado===e?'selected':''}>${e}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay solicitudes de arrepentimiento.</div>'}</div>`;
}
async function setArrep(id,e){
  if(!can('arrepentimientos')||!ARREP_ESTADOS.includes(e))return;
  try{await api('PATCH','/api/admin/arrepentimientos/'+id+'/estado',{estado:e});await loadTab('arrepentimientos')}catch(err){alert(err.message)}
  render();
}
/* newsletter */
function aNews(){
  if(!can('newsletter'))return '<div class="panel empty">No tenés permiso para ver esta sección.</div>';
  const L=db.subs.slice().reverse(),all=db.subs.map(x=>x.email).join(', ');
  return `<div class="panel"><h3 style="margin-bottom:10px">Suscriptores del newsletter (${L.length})</h3>
  ${L.length?`<div class="f" style="margin-bottom:10px"><label for="nlall">Todos los emails (para copiar y pegar)</label><textarea id="nlall" rows="3" readonly onfocus="this.select()">${esc(all)}</textarea></div>
  <button class="btn sec" style="margin-bottom:12px" onclick="copyEmails()">Copiar emails</button> <span id="cpm" class="mut" role="status"></span>
  <div class="tw"><table><thead><tr><th>Email</th><th>Se suscribió</th><th></th></tr></thead><tbody>
  ${L.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.date?fdate(x.date):'—'}</td><td class="r"><button class="btn del" style="padding:4px 10px;font-size:.85rem" onclick="delSub('${esc(x.email)}')">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay suscriptores. Los emails se cargan desde el pie de la tienda.</div>'}</div>`;
}
function copyEmails(){
  const t=document.getElementById('nlall'),m=document.getElementById('cpm');
  const ok=()=>{if(m)m.textContent='Emails copiados.'},no=()=>{if(m)m.textContent='No se pudo copiar solo: seleccioná el cuadro y copiá con Ctrl+C.'};
  const old=()=>{try{t.select();document.execCommand('copy')?ok():no()}catch(e){no()}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,old);else old();
}
async function delSub(email){
  if(!can('newsletter')||!confirm('¿Quitar este email del newsletter?'))return;
  try{await api('DELETE','/api/admin/newsletter',{email});await loadTab('newsletter')}catch(err){alert(err.message)}
  render();
}
/* ganancias (solo dueño) */
function labelG(p){
  if(S.per==='anio')return p;
  const d=new Date(p+'T00:00:00');
  if(S.per==='dia')return fdate(d);
  if(S.per==='semana')return 'Semana del '+fdate(d);
  return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]+' '+d.getFullYear();
}
async function setPer(k){S.per=k;try{await loadTab('ganancias')}catch(e){alert(e.message)}render()}
function aGan(){
  if(!can('ganancias'))return `<div class="panel empty">Esta sección es solo para el dueño.</div>`;
  const G=db.gan;if(!G)return '<div class="panel empty">Cargando…</div>';
  const TV=G.total.v||0,TC=G.total.c||0,rows=G.rows,top=G.productos;
  const max=Math.max(1,...rows.map(r=>r.v-r.c));
  const pct=(v,c)=>v?((v-c)/v*100).toFixed(1)+'%':'—';
  return `<div class="panel"><h3 style="margin-bottom:12px">Ganancias</h3>
  <div class="kpis"><div class="kpi"><span class="mut">Ventas netas</span><strong>${$m(TV)}</strong></div><div class="kpi"><span class="mut">Costo de la mercadería</span><strong>${$m(TC)}</strong></div><div class="kpi"><span class="mut">Ganancia</span><strong>${$m(TV-TC)}</strong></div><div class="kpi"><span class="mut">Margen</span><strong>${pct(TV,TC)}</strong></div></div>
  <p class="mut">Ganancia = ventas sin IVA (con descuentos) menos el costo de lo vendido. No incluye el envío ni otros gastos. Los pedidos cancelados no cuentan.</p>
  <div class="tabs" role="tablist">${[['dia','Diaria'],['semana','Semanal'],['mes','Mensual'],['anio','Anual']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.per===k}" onclick="setPer('${k}')">${l}</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Período</th><th class="r">Pedidos</th><th class="r">Ventas netas</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen</th><th style="width:20%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(labelG(r.periodo))}</td><td class="r">${r.pedidos}</td><td class="r">${$m(r.v)}</td><td class="r">${$m(r.c)}</td><td class="r"><strong>${$m(r.v-r.c)}</strong></td><td class="r">${pct(r.v,r.c)}</td><td><div class="bar" style="width:${Math.max(2,Math.round(Math.max(0,r.v-r.c)/max*100))}%"></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay ventas registradas.</div>'}
  <h3 style="margin:22px 0 10px">Productos que más ganancia dejan</h3>
  ${top.length?`<div class="tw"><table><thead><tr><th>Producto</th><th class="r">Unidades</th><th class="r">Ventas netas</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>
  ${top.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.qty}</td><td class="r">${$m(x.v)}</td><td class="r"><strong>${$m(x.v-x.c)}</strong></td><td class="r">${pct(x.v,x.c)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin datos.</div>'}</div>`;
}
document.addEventListener('click',e=>{if(S.menu!==null&&!e.composedPath().includes(document.getElementById('mega'))){S.menu=null;renderMega()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menu!==null){S.menu=null;renderMega()}});
document.getElementById('mega').addEventListener('mouseleave',()=>{if(hoverOK()&&S.menu!==null){S.menu=null;renderMega()}});
boot();
</script>
</body>
