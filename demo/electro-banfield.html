function mkOrder(id,date,items,cliente,email,addr,o){
  o=o||{};

  const net=items.reduce((a,i)=>a+i.net*i.qty,0)*k+envio/1.21;
  const iva=items.reduce((a,i)=>a+i.net*i.qty*i.iva/100,0)*k+envio-envio/1.21;
  const ventaNeta=items.reduce((a,i)=>a+i.net*i.qty,0)*k,costo=items.reduce((a,i)=>a+(i.cost||0)*i.qty,0);
  return {id,date,items,cliente,email:email||'',addr:addr||'',net,iva,total:net+iva,sub,dsc,envio,retiro:!!o.retiro,estado:'pendiente',ventaNeta,costo,ganancia:ventaNeta-costo};
}

/* ---------- PAGO SIMULADO ----------
   Es una simulación: no se cobra nada. El número de la tarjeta y el CVC se validan en el navegador y NUNCA se guardan
   ni se envían: del pago solo queda la marca y los últimos 4 dígitos. Para cobrar de verdad hay que integrar una pasarela de pago. */
const PAISES=['Argentina','Uruguay','Chile','Paraguay','Bolivia','Brasil','Perú','Colombia','México','España','Estados Unidos','Otro'];
const TARJETA_PRUEBA='4111 1111 1111 1111';
const dig=v=>String(v==null?'':v).replace(/\D/g,'');
function luhn(n){let t=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}t+=d;alt=!alt}return n.length>0&&t%10===0}
function marcaDe(n){return /^4/.test(n)?'Visa':/^(5[1-5]|2[2-7])/.test(n)?'Mastercard':/^3[47]/.test(n)?'American Express':'Otra'}
function fmtCard(el){
  const n=dig(el.value).slice(0,19),g=/^3[47]/.test(n)?[4,6,5]:[4,4,4,4,3],out=[];let i=0;
  for(const k of g){if(i>=n.length)break;out.push(n.slice(i,i+k));i+=k}
  el.value=out.join(' ');const b=document.getElementById('fb');if(b)b.textContent=n.length>=2?marcaDe(n):'';
}
function fmtExp(el){let v=dig(el.value).slice(0,4);if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);el.value=v}
function onlyDig(el,max){el.value=dig(el.value).slice(0,max)}
function validarPago(F){
  const nom=(F.n||'').trim().replace(/\s+/g,' ');
  if(nom.length<5||!nom.includes(' '))return 'Ingresá tu nombre completo (nombre y apellido).';
  if(!/^\d{7,8}$/.test(dig(F.dni)))return 'El DNI tiene que tener 7 u 8 números, sin puntos.';
  if(!/^\S+@\S+\.\S+$/.test((F.e||'').trim()))return 'Ingresá un email válido.';
  if(!F.pais)return 'Elegí tu país.';
  if((F.ciudad||'').trim().length<2)return 'Ingresá tu ciudad.';
  if((F.dir||'').trim().length<5)return 'Ingresá tu dirección (calle y número).';
  if(!/^[A-Za-z0-9 -]{3,10}$/.test((F.cp||'').trim()))return 'El código postal no es válido.';
  const num=dig(F.tar);
  if(num.length<13||num.length>19||!luhn(num))return 'El número de tarjeta no es válido. Para probar usá '+TARJETA_PRUEBA+'.';
  const m=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec((F.venc||'').trim());
  if(!m)return 'El vencimiento tiene que tener el formato MM/AA (por ejemplo 12/30).';
  if(new Date(2000+(+m[2]),+m[1],1)<=new Date())return 'La tarjeta está vencida.';
  const need=marcaDe(num)==='American Express'?4:3;
  if(dig(F.cvc).length!==need)return 'El CVC tiene que tener '+need+' números.';
  return null;
}
function pasarelaSimulada(F){
  const num=dig(F.tar),u=num.slice(-4);
  if(u==='0002')return {ok:false,msg:'El banco rechazó la tarjeta (simulación). Probá con otra tarjeta.'};
  if(u==='9995')return {ok:false,msg:'La tarjeta no tiene fondos suficientes (simulación). Probá con otra tarjeta.'};
  return {ok:true,marca:marcaDe(num),ultimos4:u};
}

  return `<h2 style="margin-bottom:6px">Confirmar pedido</h2><p class="mut" style="margin:0 0 12px">Comprás sin crear una cuenta.</p><div class="panel">
  <div class="simbox" role="note"><strong>Pago simulado</strong>
  <p>Esto es una demostración: no se cobra nada y <strong>no ingreses los datos de tu tarjeta real</strong>. Usá una tarjeta de prueba:</p>
  <ul><li><code>4111 1111 1111 1111</code>: pago aprobado</li><li><code>4000 0000 0000 0002</code>: tarjeta rechazada</li><li><code>4000 0000 0000 9995</code>: fondos insuficientes</li></ul>
  <p>Con cualquier vencimiento futuro y un CVC de 3 números.</p><button type="button" class="btn sec" onclick="datosPrueba()">Completar con datos de prueba</button></div>
  <h3 class="ch">Tus datos</h3>
  <div class="two"><div class="f"><label for="fn">Nombre completo</label><input id="fn" autocomplete="name" value="${v('n')}"></div><div class="f"><label for="fi">DNI</label><input id="fi" inputmode="numeric" maxlength="8" placeholder="Sin puntos" oninput="onlyDig(this,8)" value="${v('dni')}"></div></div>

  await new Promise(r=>setTimeout(r,1500));            // simula la espera de la pasarela de pago

  const n=F.n.trim().replace(/\s+/g,' '),e=F.e.trim().toLowerCase(),dir=F.dir.trim(),cp=F.cp.trim().toUpperCase(),ciudad=F.ciudad.trim();

const hexB=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
const randHex=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,'0')).join('');
// SHA-256(sal + clave en UTF-16), el mismo esquema que usa la base SQL Server (HASHBYTES('SHA2_256', sal + clave))
async function hashPass(saltHex,pass){
  const salt=hexB(saltHex),pb=new Uint8Array(pass.length*2);
  for(let i=0;i<pass.length;i++){const c=pass.charCodeAt(i);pb[2*i]=c&255;pb[2*i+1]=c>>8}
  const all=new Uint8Array(salt.length+pb.length);all.set(salt);all.set(pb,salt.length);
  const d=await crypto.subtle.digest('SHA-256',all);
  return Array.from(new Uint8Array(d),b=>b.toString(16).padStart(2,'0')).join('');
}

async function login(){
  const u=lu.value.trim();
  const emp=db.employees.find(e=>e.user===u&&e.pass===lp.value);
  if(emp){S.cust=null;S.user=emp;S.tab=tabsFor(emp.role)[0];S.err='';go('admin');return}
  const c=db.customers.find(x=>x.email===u.toLowerCase());
  if(c&&await hashPass(c.salt,lp.value)===c.hash){S.user=null;S.cust=c;S.err='';S.form={n:c.name,e:c.email,a:''};go('cuenta');return}
  S.err='Email, usuario o contraseña incorrectos.';renderMain();
}
async function signup(){
  const n=sn.value.trim(),e=se.value.trim().toLowerCase(),p=sp.value,p2=sp2.value;S.su={n,e};
  const err=m=>{S.err=m;renderMain()};
  if(!n)return err('Ingresá tu nombre.');
  if(!/^\S+@\S+\.\S+$/.test(e))return err('Ingresá un email válido.');
  if(p.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
  if(p!==p2)return err('Las contraseñas no coinciden.');
  if(db.customers.some(c=>c.email===e)||db.employees.some(x=>x.user.toLowerCase()===e))return err('Ya existe una cuenta con ese email.');
  const salt=randHex(16),hash=await hashPass(salt,p);
  const c={id:db.customers.reduce((m,x)=>Math.max(m,x.id),0)+1,name:n,email:e,salt,hash,date:new Date().toISOString()};
  db.customers.push(c);save();
  S.cust=c;S.user=null;S.err='';S.su={n:'',e:''};S.form={n:c.name,e:c.email,a:''};go('cuenta');
}

const lst=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
function saveProd(id){
  if(!can('altabaja'))return;
  const name=pn.value.trim();const net=parseFloat(pp.value);
  if(!name||isNaN(net)||net<0){perr.innerHTML='<div class="msg">Ingresá nombre y un precio neto válido.</div>';return}
  const apply=img=>{
    const o={name,desc:pd.value.trim(),cat:pc.value.trim()||'General',emoji:pe.value.trim()||'📦',net,iva:parseFloat(pv.value)||0,disc:parseFloat(pdc.value)||0,stock:Math.max(0,parseInt(ps.value)||0),sizes:lst(pt.value),colors:lst(pk.value),kind:ptype.value,brand:pbrand.value.trim(),year:pyear.value.trim()};
    if(can('ganancias')&&document.getElementById('pcost'))o.cost=Math.max(0,parseFloat(pcost.value)||0);
    if(id){const p=db.products.find(x=>x.id===id);Object.assign(p,o);if(img)p.img=img}
    else{o.id=db.products.reduce((m,x)=>Math.max(m,x.id),0)+1;o.activo=true;if(o.cost===undefined)o.cost=0;if(img)o.img=img;db.products.push(o)}
    save();dlg.close();render();
  };
  const f=pi.files&&pi.files[0];
  if(f){if(f.size>300000){perr.innerHTML='<div class="msg">La imagen supera los 300 KB.</div>';return}const r=new FileReader();r.onload=()=>apply(r.result);r.readAsDataURL(f)}else apply(null);
}
/* empleados */
function aEmp(){
  return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h3>Empleados y roles</h3><button class="btn" onclick="empForm()">Nuevo empleado</button></div>
  <div class="tw"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th></th></tr></thead><tbody>
  ${db.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.user)}</td><td>${esc(ROLES[e.role])}</td><td class="r"><button class="btn sec" onclick="empForm(${e.id})">Editar</button> <button class="btn del" onclick="delEmp(${e.id})">Borrar</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function empForm(id){
  const e=db.employees.find(x=>x.id===id)||{name:'',user:'',pass:'',role:'cajero'};
  if(e.role==='dueno'&&S.user.role!=='dueno'){alert('Solo el dueño puede modificar al dueño.');return}
  dlg.innerHTML=`<h3 style="margin-bottom:12px">${id?'Editar':'Nuevo'} empleado</h3><div class="f" style="margin-bottom:8px"><label>Nombre completo</label><input id="en" value="${esc(e.name)}"></div>
  <div class="two" style="margin-bottom:8px"><div class="f"><label>Usuario</label><input id="eu" value="${esc(e.user)}"></div><div class="f"><label>Contraseña</label><input id="ep" type="text" value="${esc(e.pass)}"></div></div>
  <div class="f" style="margin-bottom:8px"><label>Rol</label><select id="er">${Object.entries(ROLES).filter(([k])=>S.user.role==='dueno'||k!=='dueno').map(([k,v])=>`<option value="${k}" ${e.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div id="perr"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" onclick="dlg.close()">Cancelar</button><button class="btn" onclick="saveEmp(${id||0})">Guardar cambios</button></div>`;
  dlg.showModal();
}
function saveEmp(id){
  const o={name:en.value.trim(),user:eu.value.trim(),pass:ep.value,role:er.value};
  if(!o.name||!o.user||o.pass.length<4){perr.innerHTML='<div class="msg">Completá nombre, usuario y una contraseña de al menos 4 caracteres.</div>';return}
  if(db.employees.some(x=>x.user===o.user&&x.id!==id)){perr.innerHTML='<div class="msg">Ese usuario ya existe.</div>';return}
  if(o.role==='dueno'&&S.user.role!=='dueno'){perr.innerHTML='<div class="msg">Solo el dueño puede crear otro dueño.</div>';return}
  const prev=id&&db.employees.find(x=>x.id===id);
  if(prev&&prev.role==='dueno'&&o.role!=='dueno'&&!db.employees.some(x=>x.role==='dueno'&&x.id!==id)){perr.innerHTML='<div class="msg">Tiene que haber al menos un dueño.</div>';return}
  if(id){const e=db.employees.find(x=>x.id===id);Object.assign(e,o);if(S.user.id===id)S.user=e}
  else{o.id=db.employees.reduce((m,x)=>Math.max(m,x.id),0)+1;db.employees.push(o)}
  save();dlg.close();render();
}
function delEmp(id){
  const e=db.employees.find(x=>x.id===id);if(!e)return;
  if(id===S.user.id){alert('No podés borrar tu propio usuario.');return}
  if(e.role==='dueno'&&S.user.role!=='dueno'){alert('Solo el dueño puede borrar al dueño.');return}
  if(e.role==='dueno'&&db.employees.filter(x=>x.role==='dueno').length<2){alert('Tiene que haber al menos un dueño.');return}
  if(confirm('¿Borrar este empleado?')){db.employees=db.employees.filter(x=>x.id!==id);save();render()}
}
/* ventas */
function filtered(){
  return db.orders.filter(o=>{const d=o.date.slice(0,10);return(!S.from||d>=S.from)&&(!S.to||d<=S.to)&&(!S.prod||o.items.some(i=>i.id==S.prod))}).slice().reverse();
}
function aVentas(){
  const L=filtered();
  const tot=L.filter(o=>o.estado!=='cancelado').reduce((a,o)=>a+o.total,0);
  return `<div class="panel"><h3 style="margin-bottom:10px">Listado general de ventas</h3><div class="row">
  <div class="f"><label>Desde</label><input type="date" value="${S.from}" onchange="S.from=this.value;render()"></div>
  <div class="f"><label>Hasta</label><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div>
  <div class="f"><label>Producto</label><select onchange="S.prod=this.value;render()"><option value="">Todos</option>${db.products.map(p=>`<option value="${p.id}" ${S.prod==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <button class="btn sec" onclick="S.from=S.to=S.prod='';render()">Limpiar filtros</button></div>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Estado</th><th class="r">Total</th></tr></thead><tbody>
  ${L.map(o=>`<tr><td>${o.id}</td><td>${fdate(o.date)}</td><td>${esc(o.cliente)}</td><td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.size||i.color||i.pers?' ('+esc(vlabel(i.size,i.color,i.pers))+')':''}`).join(', ')}</td><td>${stBadge(o)}</td><td class="r">${$m(o.total)}</td></tr>`).join('')}</tbody></table></div>
  <div class="tot big"><span>${L.filter(o=>o.estado!=='cancelado').length} ventas (sin contar canceladas)</span><span>${$m(tot)}</span></div>`:`<div class="empty">No hay ventas para esos filtros.</div>`}</div>`;
}
/* facturacion */
function weekStart(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function keyOf(iso){
  const d=new Date(iso);
  if(S.per==='dia')return [dstr(d),fdate(d)];
  if(S.per==='semana'){const w=weekStart(d);return [dstr(w),'Semana del '+fdate(w)]}
  if(S.per==='mes')return [`${d.getFullYear()}-${pad(d.getMonth()+1)}`,['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]+' '+d.getFullYear()];
  return [String(d.getFullYear()),String(d.getFullYear())];
}
function aFact(){
  const g={};
  db.orders.filter(o=>o.estado!=='cancelado').forEach(o=>{const [k,l]=keyOf(o.date);const r=g[k]||(g[k]={l,n:0,net:0,iva:0,total:0});r.n++;r.net+=o.net;r.iva+=o.iva;r.total+=o.total});
  const rows=Object.keys(g).sort().reverse().map(k=>g[k]);
  const max=Math.max(1,...rows.map(r=>r.total));
  const T=rows.reduce((a,r)=>({net:a.net+r.net,iva:a.iva+r.iva,total:a.total+r.total}),{net:0,iva:0,total:0});
  return `<div class="panel"><h3 style="margin-bottom:10px">Facturación</h3><div class="tabs" role="tablist">${[['dia','Diaria'],['semana','Semanal'],['mes','Mensual'],['anio','Anual']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.per===k}" onclick="S.per='${k}';render()">${l}</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Período</th><th class="r">Pedidos</th><th class="r">Neto</th><th class="r">IVA</th><th class="r">Total</th><th style="width:25%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.l)}</td><td class="r">${r.n}</td><td class="r">${$m(r.net)}</td><td class="r">${$m(r.iva)}</td><td class="r"><strong>${$m(r.total)}</strong></td><td><div class="bar" style="width:${Math.round(r.total/max*100)}%"></div></td></tr>`).join('')}</tbody></table></div>
  <div class="tot big"><span>Total facturado</span><span>${$m(T.total)}</span></div><div class="mut">Neto ${$m(T.net)} · IVA ${$m(T.iva)}</div>`:`<div class="empty">Todavía no hay ventas registradas.</div>`}</div>`;
}
/* pedidos: estados */
const stBadge=o=>`<span class="st st-${o.estado||'pendiente'}">${o.estado||'pendiente'}</span>`;
function pSearch(v){S.pq=v;renderMain();const i=document.getElementById('pqi');if(i&&i.focus){i.focus();if(i.setSelectionRange)i.setSelectionRange(v.length,v.length)}}
function aPed(){
  if(!can('pedidos'))return '<div class="panel empty">No tenés permiso para ver los pedidos.</div>';
  const q=S.pq.toLowerCase(),cnt=e=>db.orders.filter(o=>o.estado===e).length;
  const L=db.orders.slice().reverse().filter(o=>(!S.pf||o.estado===S.pf)&&(!q||String(o.id).includes(q)||(o.cliente+' '+(o.email||'')).toLowerCase().includes(q)));
  return `<div class="panel"><h3 style="margin-bottom:10px">Pedidos y estados</h3>
  <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${!S.pf}" onclick="S.pf='';renderMain()">Todos (${db.orders.length})</button>${ESTADOS.map(e=>`<button class="tab" role="tab" aria-selected="${S.pf===e}" onclick="S.pf='${e}';renderMain()">${e[0].toUpperCase()+e.slice(1)} (${cnt(e)})</button>`).join('')}</div>
  <div class="row"><div class="f"><label for="pqi">Buscar por número, nombre o email</label><input id="pqi" value="${esc(S.pq)}" oninput="pSearch(this.value)"></div></div>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Entrega</th><th>Productos</th><th class="r">Total</th><th>Estado</th></tr></thead><tbody>
  ${L.map(o=>`<tr><td>${o.id}</td><td>${fdate(o.date)}</td><td>${esc(o.cliente)}<div class="mut">${esc(o.email||'')}</div>${o.dni?`<div class="mut">DNI ${esc(o.dni)}</div>`:''}</td><td>${o.retiro?'Retiro en sucursal':esc(o.addr||'—')}</td>
  <td>${o.items.map(i=>`${i.qty}× ${esc(i.name)}${i.size||i.color||i.pers?' ('+esc(vlabel(i.size,i.color,i.pers))+')':''}`).join(', ')}</td><td class="r">${$m(o.total)}</td>
  <td>${o.estado==='cancelado'?stBadge(o):`<select aria-label="Estado del pedido ${o.id}" onchange="setEstado(${o.id},this.value)">${ESTADOS.map(e=>`<option ${o.estado===e?'selected':''}>${e}</option>`).join('')}</select>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay pedidos con ese filtro.</div>'}
  <p class="mut">Al cancelar un pedido se devuelve el stock y deja de contarse en la facturación y en las ganancias. Un pedido cancelado no se puede reactivar.</p></div>`;
}
function setEstado(id,e){
  if(!can('pedidos'))return;
  const o=db.orders.find(x=>x.id===id);if(!o||o.estado==='cancelado'||o.estado===e||!ESTADOS.includes(e)){render();return}
  if(e==='cancelado'){
    if(!confirm('¿Cancelar el pedido '+id+'? Se devuelve el stock y no se puede reactivar.')){render();return}
    if(o.stockDesc)o.items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(p)p.stock+=i.qty});
  }
  o.estado=e;save();render();
}
/* arrepentimientos */
function aArrep(){
  if(!can('arrepentimientos'))return '<div class="panel empty">No tenés permiso para ver esta sección.</div>';
  const L=db.cancels.slice().reverse();
  return `<div class="panel"><h3 style="margin-bottom:10px">Solicitudes de arrepentimiento</h3>
  ${L.length?`<div class="tw"><table><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Compra</th><th class="r">Monto a reembolsar</th><th>Estado</th></tr></thead><tbody>
  ${L.map(c=>{const o=db.orders.find(x=>String(x.id)===String(c.pedido).trim());return `<tr><td>${c.id}</td><td>${fdate(c.date)}</td><td>${esc(c.nombre||'—')}<div class="mut">${esc(c.email)}</div></td>
  <td>N° ${esc(c.pedido)}<div class="mut">${o?`Pedido encontrado · ${esc(o.cliente)} · ${$m(o.total)} · ${stBadge(o)}`:'No coincide con ningún pedido'}</div>${o&&o.estado!=='cancelado'&&can('pedidos')?`<button class="btn del" style="margin-top:6px;padding:4px 10px;font-size:.85rem" onclick="setEstado(${o.id},'cancelado')">Cancelar ese pedido</button>`:''}</td>
  <td class="r">${c.monto?$m(c.monto):'—'}</td><td><select aria-label="Estado de la solicitud ${c.id}" onchange="setArrep(${c.id},this.value)">${ARREP_ESTADOS.map(e=>`<option ${c.estado===e?'selected':''}>${e}</option>`).join('')}</select></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay solicitudes de arrepentimiento.</div>'}</div>`;
}
function setArrep(id,e){if(!can('arrepentimientos')||!ARREP_ESTADOS.includes(e))return;const c=db.cancels.find(x=>x.id===id);if(c){c.estado=e;save();render()}}
/* newsletter */
function aNews(){
  if(!can('newsletter'))return '<div class="panel empty">No tenés permiso para ver esta sección.</div>';
  const L=db.subs.slice().reverse(),all=db.subs.map(x=>x.email).join(', ');
  return `<div class="panel"><h3 style="margin-bottom:10px">Suscriptores del newsletter (${L.length})</h3>
  ${L.length?`<div class="f" style="margin-bottom:10px"><label for="nlall">Todos los emails (para copiar y pegar)</label><textarea id="nlall" rows="3" readonly onfocus="this.select()">${esc(all)}</textarea></div>
  <button class="btn sec" style="margin-bottom:12px" onclick="copyEmails()">Copiar emails</button> <span id="cpm" class="mut" role="status"></span>
  <div class="tw"><table><thead><tr><th>Email</th><th>Se suscribió</th><th></th></tr></thead><tbody>
  ${L.map(x=>`<tr><td>${esc(x.email)}</td><td>${x.date?fdate(x.date):'—'}</td><td class="r"><button class="btn del" style="padding:4px 10px;font-size:.85rem" onclick="delSub('${esc(x.email)}')">Quitar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay suscriptores. Los emails se cargan desde el pie de la tienda.</div>'}</div>`;
}
function copyEmails(){
  const t=document.getElementById('nlall'),m=document.getElementById('cpm');
  const ok=()=>{if(m)m.textContent='Emails copiados.'},no=()=>{if(m)m.textContent='No se pudo copiar solo: seleccioná el cuadro y copiá con Ctrl+C.'};
  const old=()=>{try{t.select();document.execCommand('copy')?ok():no()}catch(e){no()}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,old);else old();
}
function delSub(email){if(!can('newsletter'))return;if(confirm('¿Quitar este email del newsletter?')){db.subs=db.subs.filter(x=>x.email!==email);save();render()}}
/* ganancias (solo dueño) */
function lineasGan(o){const k=o.sub?(o.sub-o.dsc)/o.sub:1;return o.items.map(i=>{const v=i.net*i.qty*k,c=(i.cost||0)*i.qty;return{id:i.id,name:i.name,qty:i.qty,v,c}})}
function aGan(){
  if(!can('ganancias'))return `<div class="panel empty">Esta sección es solo para el dueño.</div>`;
  const g={},pr={};let TV=0,TC=0;
  db.orders.filter(o=>o.estado!=='cancelado').forEach(o=>{
    const L=lineasGan(o),v=L.reduce((a,x)=>a+x.v,0),c=L.reduce((a,x)=>a+x.c,0);
    const [k,l]=keyOf(o.date);const r=g[k]||(g[k]={l,n:0,v:0,c:0});r.n++;r.v+=v;r.c+=c;TV+=v;TC+=c;
    L.forEach(x=>{const q=pr[x.id]||(pr[x.id]={name:x.name,qty:0,v:0,c:0});q.qty+=x.qty;q.v+=x.v;q.c+=x.c});
  });
  const rows=Object.keys(g).sort().reverse().map(k=>g[k]);
  const max=Math.max(1,...rows.map(r=>r.v-r.c));
  const top=Object.values(pr).sort((a,b)=>(b.v-b.c)-(a.v-a.c)).slice(0,10);
  const pct=(v,c)=>v?((v-c)/v*100).toFixed(1)+'%':'—';
  return `<div class="panel"><h3 style="margin-bottom:12px">Ganancias</h3>
  <div class="kpis"><div class="kpi"><span class="mut">Ventas netas</span><strong>${$m(TV)}</strong></div><div class="kpi"><span class="mut">Costo de la mercadería</span><strong>${$m(TC)}</strong></div><div class="kpi"><span class="mut">Ganancia</span><strong>${$m(TV-TC)}</strong></div><div class="kpi"><span class="mut">Margen</span><strong>${pct(TV,TC)}</strong></div></div>
  <p class="mut">Ganancia = ventas sin IVA (con descuentos) menos el costo de lo vendido. No incluye el envío ni otros gastos.</p>
  <div class="tabs" role="tablist">${[['dia','Diaria'],['semana','Semanal'],['mes','Mensual'],['anio','Anual']].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.per===k}" onclick="S.per='${k}';render()">${l}</button>`).join('')}</div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Período</th><th class="r">Pedidos</th><th class="r">Ventas netas</th><th class="r">Costo</th><th class="r">Ganancia</th><th class="r">Margen</th><th style="width:20%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.l)}</td><td class="r">${r.n}</td><td class="r">${$m(r.v)}</td><td class="r">${$m(r.c)}</td><td class="r"><strong>${$m(r.v-r.c)}</strong></td><td class="r">${pct(r.v,r.c)}</td><td><div class="bar" style="width:${Math.max(2,Math.round(Math.max(0,r.v-r.c)/max*100))}%"></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay ventas registradas.</div>'}
  <h3 style="margin:22px 0 10px">Productos que más ganancia dejan</h3>
  ${top.length?`<div class="tw"><table><thead><tr><th>Producto</th><th class="r">Unidades</th><th class="r">Ventas netas</th><th class="r">Ganancia</th><th class="r">Margen</th></tr></thead><tbody>
  ${top.map(x=>`<tr><td>${esc(x.name)}</td><td class="r">${x.qty}</td><td class="r">${$m(x.v)}</td><td class="r"><strong>${$m(x.v-x.c)}</strong></td><td class="r">${pct(x.v,x.c)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sin datos.</div>'}</div>`;
}
document.addEventListener('click',e=>{if(S.menu!==null&&!e.composedPath().includes(document.getElementById('mega'))){S.menu=null;renderMega()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menu!==null){S.menu=null;renderMega()}});
document.getElementById('mega').addEventListener('mouseleave',()=>{if(hoverOK()&&S.menu!==null){S.menu=null;renderMega()}});
render();
</script>
